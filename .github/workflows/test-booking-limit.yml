name: Test Almflair Buchungsgrenze

on:
  workflow_dispatch:
    inputs:
      buchungsfrist_tage:
        description: 'Maximale Vorausbuchungsfrist in Tagen'
        required: true
        default: '365'
        type: string

permissions:
  contents: read

jobs:
  test-booking-limit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository lesen
        uses: actions/checkout@v4

      - name: Buchungsgrenze berechnen
        env:
          BUCHUNGSFRIST_TAGE: ${{ inputs.buchungsfrist_tage }}
        run: python3 booking-limit-preview.py
