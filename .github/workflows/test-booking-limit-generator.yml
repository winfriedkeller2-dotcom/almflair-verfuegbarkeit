name: Test Almflair iCal-Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read

jobs:
  generator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Repository lesen
        uses: actions/checkout@v4

      - name: iCal-Testdatei erzeugen
        run: python3 booking-limit-generator.py

      - name: Testdatei validieren
        run: |
          python3 - <<'PY'
          from pathlib import Path

          datei = Path("booking-limit-vorschau.ics")
          inhalt = datei.read_text(encoding="utf-8")

          assert inhalt.startswith("BEGIN:VCALENDAR")
          assert "BEGIN:VEVENT" in inhalt
          assert "DTSTART;VALUE=DATE:" in inhalt
          assert "DTEND;VALUE=DATE:" in inhalt
          assert inhalt.strip().endswith("END:VCALENDAR")

          print("iCal-Testdatei erfolgreich validiert.")
          PY
